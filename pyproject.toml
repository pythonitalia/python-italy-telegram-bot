[project]
name = "python-italy-telegram-bot"
version = "0.1.0"
description = "Official Telegram bot for the main Italian Python group and local sub-groups in Italy"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot[job-queue]>=22.0",
    "python-dotenv>=1.0",
    "psycopg[binary,pool]>=3.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.0",
    "pytest>=9.0.3",
]

[project.scripts]
python-italy-bot = "python_italy_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_italy_bot"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.8",
    "mypy>=1.0",
    "pytest>=9.0.3",
]
